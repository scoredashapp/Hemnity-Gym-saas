<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Hemnity Gym Management Software</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0c0e12;
        color: #f9fafb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #141820;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 32px;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: #ea580c;
        color: #fff;
        font-weight: 800;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.6;
        color: #9ca3af;
      }
      button {
        background: #ea580c;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">H</div>
      <h1>You are currently offline</h1>
      <p>
        Hemnity Gym Management Software requires an active connection to sync tenant attendance,
        member check-ins, and payment records securely. Reconnect to continue.
      </p>
      <button type="button" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
