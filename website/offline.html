<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline — Hemnity Gym Management Software</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#f8f9fb;color:#111827;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{max-width:440px;width:100%;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:32px;text-align:center}
    .mark{display:inline-flex;width:44px;height:44px;border-radius:10px;background:#ea580c;color:#fff;font-weight:700;align-items:center;justify-content:center;margin-bottom:14px}
    h1{font-size:20px;margin:0 0 8px}
    p{font-size:14px;color:#4b5563;line-height:1.6;margin:0 0 20px}
    button{background:#111827;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">H</div>
    <h1>You are currently offline</h1>
    <p>Hemnity Gym Management Software requires an active network connection to sync live attendance, member records, and receipts.</p>
    <button type="button" onclick="window.location.reload()">Try Reconnecting</button>
  </div>
</body>
</html>
